name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Smoke test
        run: |
          set -euo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/guinee-logistique.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -30 /tmp/guinee-logistique.log' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/api/health | jq -e '.status == "ok" and .service == "guinee-logistique"'
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
