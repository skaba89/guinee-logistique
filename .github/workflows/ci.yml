name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run db:generate
      - run: bunx prisma generate --schema prisma/saas/schema.prisma
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Smoke test
        run: |
          set -euo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/guinee-logistique.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -30 /tmp/guinee-logistique.log' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/api/health | jq -e '.status == "ok" and .service == "guinee-logistique"'
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/saas)" = 404
          kill "$pid"
          wait "$pid" || true
          SAAS_AUTH_ENABLED=true SAAS_AUTH_DATABASE_URL= SAAS_PUBLIC_ORIGIN= PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js >> /tmp/guinee-logistique.log 2>&1 &
          pid=$!
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/api/health > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 307
          curl -fsS http://127.0.0.1:3000/saas > /tmp/saas-unavailable.html
          grep -q 'Service temporairement indisponible' /tmp/saas-unavailable.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/scan)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/chat)" = 503
          kill "$pid"
          wait "$pid" || true
          SAAS_AUTH_ENABLED=true SAAS_AUTH_DATABASE_URL=postgresql://unused:unused@localhost:5432/unused SAAS_PUBLIC_ORIGIN=https://example.invalid PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js >> /tmp/guinee-logistique.log 2>&1 &
          pid=$!
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/api/health > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/saas)" = 307
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/saas/members)" = 307
          curl -fsS http://127.0.0.1:3000/saas/login > /tmp/saas-login.html
          grep -q 'Se connecter' /tmp/saas-login.html

  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: guinee_logistique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guinee_logistique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAAS_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/guinee_logistique
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Provision restricted database role
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d guinee_logistique -v ON_ERROR_STOP=1 < prisma/saas/provision-role.sql
      - run: bunx prisma validate --schema prisma/saas/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/saas/schema.prisma
      - name: Verify database tenant isolation
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d guinee_logistique -v ON_ERROR_STOP=1 < prisma/saas/tests/isolation.sql
      - name: Test authentication with restricted login
        env:
          SAAS_AUTH_DATABASE_URL: postgresql://gl_auth_ci:ci-only@localhost:5432/guinee_logistique
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d guinee_logistique -v ON_ERROR_STOP=1 -c "CREATE ROLE gl_auth_ci LOGIN PASSWORD 'ci-only' IN ROLE gl_auth"
          bunx prisma generate --schema prisma/saas/schema.prisma
          bun test prisma/saas/tests/auth.test.ts
      - name: Test logistics with restricted tenant login
        env:
          SAAS_AUTH_DATABASE_URL: postgresql://gl_auth_ci:ci-only@localhost:5432/guinee_logistique
          SAAS_TENANT_DATABASE_URL: postgresql://gl_tenant_ci:ci-only@localhost:5432/guinee_logistique
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d guinee_logistique -v ON_ERROR_STOP=1 -c "CREATE ROLE gl_tenant_ci LOGIN PASSWORD 'ci-only' IN ROLE gl_tenant"
          bun test prisma/saas/tests/logistics.test.ts
          bun test prisma/saas/tests/portal.test.ts
          bun test prisma/saas/tests/missions.test.ts
