<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>
  <!-- Globe circle -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="white" stroke-width="18" opacity="0.25"/>
  <ellipse cx="256" cy="240" rx="70" ry="140" fill="none" stroke="white" stroke-width="14" opacity="0.2"/>
  <line x1="116" y1="240" x2="396" y2="240" stroke="white" stroke-width="12" opacity="0.2"/>
  <line x1="256" y1="100" x2="256" y2="380" stroke="white" stroke-width="12" opacity="0.15"/>
  <!-- Ship icon -->
  <g transform="translate(256,220) scale(1.1)" opacity="0.95">
    <path d="M-60,20 L-50,-10 L50,-10 L60,20 Z" fill="url(#arrowGrad)"/>
    <rect x="-8" y="-40" width="16" height="30" rx="3" fill="url(#arrowGrad)"/>
    <path d="M-40,-10 L-40,-30 L0,-45 L0,-10 Z" fill="white" opacity="0.85"/>
  </g>
  <!-- Forward arrow (Way/Direction) -->
  <g transform="translate(330,310)" opacity="0.9">
    <path d="M0,0 L40,-25 L40,-10 L80,-10 L80,10 L40,10 L40,25 Z" fill="white" transform="rotate(-15)"/>
  </g>
  <!-- LW text at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="6" opacity="0.95">LW</text>
</svg>
